name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: pwsh
        run: |
          node scripts/release-version.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne $tag) {
            throw "Tag must match the package version: $tag"
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run manual releases from main.' }
            $existing = git rev-parse --verify "refs/tags/$tag^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0 -and $existing -ne (git rev-parse HEAD)) {
              throw "$tag already points to a different commit. Bump the version first."
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --test scripts/release-version.test.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Windows installers
        run: pnpm tauri:build --bundles nsis,msi -- --locked

      - name: Collect downloads and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: sticky-notes-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release and tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "Sticky Notes $env:RELEASE_TAG" --generate-notes --notes 'Windows x64: download the setup.exe installer or the .msi package. SHA256SUMS.txt contains download checksums. These installers are unsigned; in-app automatic updates are not configured.'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Download: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
